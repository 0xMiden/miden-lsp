[package]
name = "miden-lsp"
description = "Language server for Miden projects"
license = "MIT or Apache-2.0"
version = "0.1.2"
edition = "2024"

[dependencies]
miden-assembly = "0.36.2"
miden-assembly-syntax = "0.36.2"
miden-assembly-syntax-cst = "0.36.2"
miden-core = "0.36.2"
miden-mast-package = "0.36.2"
miden-package-registry = { version = "0.36.2", features = ["resolver"] }
miden-project = "0.36.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
futures = "0.3"
tower = { version = "0.4", features = ["util"] }
